spring:
  datasource:
    url: jdbc:h2:mem:facesendtestdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ''
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
minio:
  endpoint: http://localhost:9000
  access-key: minioadmin
  secret-key: minioadmin
  bucket-name: facesend
facesend:
  room-expire-minutes: 30
  max-distance-meters: 200
