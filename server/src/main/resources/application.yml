server:
  port: 8080
  tomcat:
    connection-timeout: 300000

spring:
  profiles:
    active: ${FACE_SEND_PROFILE:local}
  application:
    name: facesend
  servlet:
    multipart:
      max-file-size: 10GB
      max-request-size: 10GB

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:mysql://localhost:3306/facesend?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 5
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

minio:
  endpoint: http://localhost:9000
  access-key: minioadmin
  secret-key: minioadmin
  bucket-name: facesend

facesend:
  room-expire-minutes: 30
  max-distance-meters: 200

